name: Build app bundle
on:
  push:
    branches: [android-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Build unsigned release bundle
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle :app:bundleRelease --no-daemon
      - name: Save the unsigned bundle on the android-builds branch
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/bundle/release/*.aab /tmp/out/unsigned-${{ github.run_number }}.aab
          cd /tmp/out && git init -q -b android-builds && git add -A
          git -c user.name="build" -c user.email="build@users.noreply.github.com" commit -qm "Unsigned bundle, build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-builds
