name: Build app bundle
on:
  push:
    branches: [android-app]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Build unsigned release bundle
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: app-bundle, path: app/build/outputs/bundle/release/*.aab }
